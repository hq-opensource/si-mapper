[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bob",
    "scratch",
    "ag-ui-adk>=0.4.0",
    "dotenv>=0.9.9",
    "edn-format>=0.7.5",
    "fastapi>=0.127.0",
    "google-adk[extensions]>=1.18.0",
    "google-genai>=1.56.0",
    "httpx>=0.28.1",
    "mcp>=1.25.0",
    "playwright>=1.40.0",
    "psycopg>=3.3.2",
    "psycopg-binary>=3.3.2",
    "pydantic>=2.12.5",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "uvicorn[standard]>=0.42.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.setuptools]
packages = []

[tool.uv.sources]
bob = { path = "../223p/bin/bob-0.99.8.tar.gz" }
scratch = { path = "../223p/bin/scratch-0.2.tar.gz" }

