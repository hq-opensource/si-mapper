services:
  si-mapper-mcp:
    build:
      context: .
      dockerfile: mcp_server/server/Dockerfile
    image: si-mapper-mcp:latest
    container_name: si-mapper-mcp
    # network_mode: host removes the need for port mapping
#    network_mode: host
    ports:
      - "8080:8080"
    env_file:
      - mcp_server/server/mcp.env
    profiles:
      - deploy
      - build

  mcp-inspector:
    image: ghcr.io/modelcontextprotocol/inspector:latest
    container_name: mcp-inspector
    # Inspector listens on 5173 (UI) and 3000 (Proxy) inside container. 
    # Current docs say it might use different ports, but host networking exposes them all.
    # We will access it typically on http://localhost:5173
#    network_mode: host
    ports:
        - "6274:6274"
        - "6277:6277"
    environment:
      - DANGEROUSLY_OMIT_AUTH=true
    profiles:
      - deploy
      - tools
    depends_on:
      - si-mapper-mcp

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    # Portainer listens on 9000
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    profiles:
      - deploy
      - tools

  neo4j:
    image: neo4j:5
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    env_file:
      - neo4j/neo4j.env
    environment:
      NEO4J_PLUGINS: '["n10s"]'
    volumes:
      - neo4j_data:/data
    profiles:
      - graph

