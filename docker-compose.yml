  graphivac:
    build:
      context: ./graphivac
      dockerfile: Dockerfile
      args:
        GRAPHIVAC_VERSION: "1.1.6"
    image: si-mapper-graphivac:latest
    container_name: si-mapper-graphivac
    working_dir: /data
    ports:
      - "8888:8888"
    volumes:
      - graphivac_data:/data
    profiles:
      - deploy
      - build

  si-mapper-agent:
    build:
      # Build context must be the project root so Docker can access 223p/bin/,
      # which is referenced as a local path dependency in agent/pyproject.toml.
      context: .
      dockerfile: agent/Dockerfile
    image: si-mapper-agent:latest
    container_name: si-mapper-agent
    ports:
      - "8001:8001"
    env_file:
      - agent/docker.env
    volumes:
      # Shared with si-mapper-frontend so both services read/write the same project files.
      - ./mapper/uploads:/app/uploads
    profiles:
      - deploy
      - build

  si-mapper-frontend:
    build:
      context: ./mapper
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* vars must be available at build time (inlined by Next.js compiler).
        # Define them in the root .env file (copy .env.example → .env) — Docker Compose
        # reads it automatically and substitutes the values below.
        NEXT_PUBLIC_AGENT_BACKEND_URL: ${NEXT_PUBLIC_AGENT_BACKEND_URL:-http://localhost:8001}
    image: si-mapper-frontend:latest
    container_name: si-mapper-frontend
    ports:
      - "3000:3000"
    env_file:
      - mapper/docker.env
    volumes:
      - ./mapper/uploads:/app/uploads
    profiles:
      - deploy
      - build

volumes:
  portainer_data:
  neo4j_data:
  graphivac_data:
